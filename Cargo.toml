[package]
name = "ftl_rust"
version = "0.1.0"
edition = "2021"

[lib]
# `staticlib` is what the C build links (`libftl_rust.a`), and `rlib` is what
# `tests/*.rs` needs to link the crate with `use ftl_rust::...`. Without `rlib`
# every integration test fails to resolve the crate (E0432).
crate-type = ["staticlib", "rlib"]

[[example]]
# The reader-facing example lives in `example/` (singular), not cargo's default
# `examples/`, so the path is explicit. `example/Makefile` drives this target.
name = "rw_example"
path = "example/rw_example.rs"

[[bin]]
# The end to end test of the C ABI. `make integration-test` builds it and runs
# it over the ramdisk, the way the C `integration-test.c` did. It declares an
# explicit path because the file sits at the crate root next to the deleted C
# program, not under `src/bin/`.
name = "integration-test"
path = "integration-test.rs"

[[bin]]
# `benchmark.c` ported. It stays at the repository root, where the C file was,
# so the Makefile rule reads `benchmark.rs` and produces the same
# `benchmark.out`.
name = "benchmark"
path = "benchmark.rs"

[features]
# When enabled, pr_info / pr_warn / pr_err expand to no-ops.
# Mirrors C `-DENABLE_LOG_SILENT` (Makefile `USE_LOG_SILENT=1`).
silent = []

# The legacy random generator, mirroring C's `-DUSE_LEGACY_RANDOM` (Makefile
# `USE_LEGACY_RANDOM=1`). It drops the `getentropy` seed of `benchmark`'s
# xorshift stream, which is all the C switch gated.
legacy-random = []

# Hardware-specific device backends. Each gates the matching `src/device/*.rs`
# stub and its `SUBMODULE_INIT` entry, so the default build links no backend
# that needs libmemio / libzbd / libnand. Full implementations land once the
# hardware is available.
bluedbm = []
raspberry = []
zone = []

[dependencies]
# Standard logging facade. Backend-agnostic — swap env_logger for
# tracing-subscriber / Loki exporter when observability story lands.
log = "0.4"
env_logger = "0.11"
# C ABI types for the ported C headers: the device layer mirrors structs that
# embed `pthread_mutex_t` / `pthread_cond_t`, and the exact size and alignment
# of those types is part of the layout contract with C. `libc` is the standard
# binding crate (no dependencies of its own).
libc = "0.2"
